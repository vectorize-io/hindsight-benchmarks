[project]
name = "hindsight-benchmark"
version = "0.1.0"
description = "Benchmark suite for Hindsight fact extraction — tests models on structured JSON output"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.25.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.2.1",
    "google-genai>=1.64.0",
    "hindsight-embed",
    "hindsight-client",
    "testcontainers>=4.14.1",
]

[project.scripts]
rag-benchmark = "hindsight_benchmark.main:main"
hindsight-benchmark = "hindsight_benchmark.cli:main"

[tool.uv.sources]
hindsight-embed = { path = "/Users/nicoloboschi/dev/memory-poc/hindsight-embed", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hindsight_benchmark"]
